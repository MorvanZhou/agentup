# 独立桌面安装包构建（mac arm64 + Windows x64 NSIS）。
# 不上传 R2；正式 downloads.agentup.me 仍走本机 sh/build-mac.sh + sh/upload-mac.sh。
#
# - workflow_dispatch / tag：产物进 Actions Artifacts
# - 仅 push tag（v*）：额外挂到对应 GitHub Release Assets
name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      desktop_env:
        description: "打进包内的控制面 / 登录门面环境"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: sh/build-mac.sh
            platform: mac
          - os: windows-latest
            script: sh/build-win.sh
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        shell: bash
        env:
          # CI 未签名；避免 electron-builder 在 Windows 上尝试签名
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          env_flag="--prod"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.desktop_env }}" = "dev" ]; then
            env_flag="--dev"
          fi
          sh "${{ matrix.script }}" "${env_flag}"

      - name: Verify runtime node_modules archive is portable
        shell: bash
        run: |
          set -euo pipefail
          runtime=""
          archive=""
          if [ "${{ matrix.platform }}" = "mac" ]; then
            runtime="$(find dist/mac -type d -path '*/Resources/runtime' | head -1)"
          else
            # NSIS 安装后会展开；校验 win-unpacked（打包中间态）里的 tgz
            runtime="$(find dist/win -type d -path '*/resources/runtime' | head -1 || true)"
            if [ -z "$runtime" ]; then
              runtime="$(find dist/win -type d -name runtime -path '*/resources/runtime' | head -1 || true)"
            fi
          fi
          if [ -n "$runtime" ] && [ -f "$runtime/node_modules.tgz" ]; then
            archive="$runtime/node_modules.tgz"
          fi
          if [ -z "$archive" ]; then
            echo "找不到打包后的 runtime/node_modules.tgz" >&2
            find dist -type d -name runtime 2>/dev/null | head -20 >&2 || true
            find dist -name 'node_modules.tgz' 2>/dev/null | head -20 >&2 || true
            exit 1
          fi
          echo "→ 校验 $archive ($(du -h "$archive" | awk '{print $1}'))"
          # 抽样列出归档内容，确认是单包而非空档
          count="$(tar -tzf "$archive" | wc -l | tr -d ' ')"
          if [ "$count" -lt 100 ]; then
            echo "node_modules.tgz 条目过少：$count" >&2
            exit 1
          fi
          echo "ok: archive entries=$count"
          # 解压后校验：相对 symlink 须仍在包内。
          # 若打包误开 follow/dereference，dmg 会从 ~160MB 胀到 220MB+（见 pack-runtime-modules.cjs）。
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "$archive" -C "$tmp"
          node -e '
            const { findEscapingSymlinks } = require("./apps/desktop/electron/materialize-modules.cjs");
            const root = process.argv[1];
            const bad = findEscapingSymlinks(root);
            if (bad.length) {
              console.error("仍有指向包外的 symlink（安装后 runtime 会挂）:");
              for (const line of bad.slice(0, 20)) console.error(" ", line);
              process.exit(1);
            }
            console.log("ok: 无外逃 symlink");
          ' "$tmp/node_modules"

      - name: Report package sizes
        shell: bash
        run: |
          echo "→ 产物体积："
          if [ -d dist/mac ]; then ls -lh dist/mac/*.{dmg,zip} 2>/dev/null || ls -lh dist/mac; fi
          if [ -d dist/win ]; then ls -lh dist/win/*-setup.exe 2>/dev/null || ls -lh dist/win; fi

      # mac：dmg / zip 分两个 artifact，便于分别下载
      - name: Upload mac dmg
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: agentup-mac-arm64-dmg
          path: dist/mac/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload mac zip
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: agentup-mac-arm64-zip
          path: dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # win：只传 NSIS，不传 win-unpacked/
      - name: Upload win setup
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: agentup-win-x64-setup
          path: dist/win/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # tag 构建成功后，把安装包挂到 GitHub Release（与 Actions Artifact 是两套东西）
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agentup-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          # 若 Release 已存在（先建了 tag/Release），则只补传 Assets；否则自动创建
          generate_release_notes: true
