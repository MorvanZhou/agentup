# 独立桌面安装包构建（mac arm64 + Windows x64 NSIS）。
#
# - workflow_dispatch / tag：产物进 Actions Artifacts
# - 仅 push tag（v*）：挂到 GitHub Release Assets，再把 Artifact 同步到 Cloudflare R2
#   （desktop/mac|win/{version,latest}/…），并 purge downloads.agentup.me 边缘缓存
# - Secrets：CLOUDFLARE_API_TOKEN（R2 写 + Zone Cache Purge）、CLOUDFLARE_ACCOUNT_ID、
#   CLOUDFLARE_ZONE_ID（downloads.agentup.me 所在 Zone）
name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      desktop_env:
        description: "打进包内的控制面 / 登录门面环境"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: sh/build-mac.sh
            platform: mac
          - os: windows-latest
            script: sh/build-win.sh
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        shell: bash
        env:
          # CI 未签名；避免 electron-builder 在 Windows 上尝试签名
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          env_flag="--prod"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.desktop_env }}" = "dev" ]; then
            env_flag="--dev"
          fi
          sh "${{ matrix.script }}" "${env_flag}"

      - name: Verify runtime node_modules archive is portable
        shell: bash
        run: |
          set -euo pipefail
          runtime=""
          archive=""
          if [ "${{ matrix.platform }}" = "mac" ]; then
            runtime="$(find dist/mac -type d -path '*/Resources/runtime' | head -1)"
          else
            # NSIS 安装后会展开；校验 win-unpacked（打包中间态）里的 tgz
            runtime="$(find dist/win -type d -path '*/resources/runtime' | head -1 || true)"
            if [ -z "$runtime" ]; then
              runtime="$(find dist/win -type d -name runtime -path '*/resources/runtime' | head -1 || true)"
            fi
          fi
          if [ -n "$runtime" ] && [ -f "$runtime/node_modules.tgz" ]; then
            archive="$runtime/node_modules.tgz"
          fi
          if [ -z "$archive" ]; then
            echo "找不到打包后的 runtime/node_modules.tgz" >&2
            find dist -type d -name runtime 2>/dev/null | head -20 >&2 || true
            find dist -name 'node_modules.tgz' 2>/dev/null | head -20 >&2 || true
            exit 1
          fi
          echo "→ 校验 $archive ($(du -h "$archive" | awk '{print $1}'))"
          # 抽样列出归档内容，确认是单包而非空档
          count="$(tar -tzf "$archive" | wc -l | tr -d ' ')"
          if [ "$count" -lt 100 ]; then
            echo "node_modules.tgz 条目过少：$count" >&2
            exit 1
          fi
          echo "ok: archive entries=$count"
          # 解压校验（见 pack-runtime-modules.cjs）：
          # - mac：归档含相对 symlink，Unix tar 允许悬空链接后再落实体
          # - win：归档须 follow=true（无 symlink）；否则 bsdtar 会 Cannot create symlink
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "$archive" -C "$tmp"
          if [ ! -d "$tmp/node_modules" ]; then
            echo "解压后缺少 node_modules" >&2
            exit 1
          fi
          node -e '
            const { findEscapingSymlinks } = require("./apps/desktop/electron/materialize-modules.cjs");
            const root = process.argv[1];
            const bad = findEscapingSymlinks(root);
            if (bad.length) {
              console.error("仍有指向包外的 symlink（安装后 runtime 会挂）:");
              for (const line of bad.slice(0, 20)) console.error(" ", line);
              process.exit(1);
            }
            console.log("ok: 无外逃 symlink");
          ' "$tmp/node_modules"

      - name: Report package sizes
        shell: bash
        run: |
          echo "→ 产物体积："
          if [ -d dist/mac ]; then ls -lh dist/mac/*.{dmg,zip} 2>/dev/null || ls -lh dist/mac; fi
          if [ -d dist/win ]; then ls -lh dist/win/*-setup.exe 2>/dev/null || ls -lh dist/win; fi

      # mac：dmg / zip 分两个 artifact，便于分别下载
      - name: Upload mac dmg
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: agentup-mac-arm64-dmg
          path: dist/mac/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload mac zip
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: agentup-mac-arm64-zip
          path: dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # win：只传 NSIS，不传 win-unpacked/
      - name: Upload win setup
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: agentup-win-x64-setup
          path: dist/win/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # tag 构建成功后，把安装包挂到 GitHub Release（与 Actions Artifact 是两套东西）
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agentup-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          # 若 Release 已存在（先建了 tag/Release），则只补传 Assets；否则自动创建
          generate_release_notes: true

  # Artifact → R2（键位对齐本机上传：versioned + latest），再 purge CDN
  upload-r2:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: agentup-*
          path: release-assets
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Upload installers to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_BUCKET: agentup-downloads
          TAG: ${{ github.ref_name }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          case "$VERSION" in
            ""|*[!0-9A-Za-z._-]*)
              echo "非法版本号: ${VERSION}（来自 ${TAG}）" >&2
              exit 1
              ;;
          esac

          PRODUCT_NAME=AgentUp
          MAC_ARCH=arm64
          DMG_NAME="${PRODUCT_NAME}-${VERSION}-${MAC_ARCH}.dmg"
          ZIP_NAME="${PRODUCT_NAME}-${VERSION}-${MAC_ARCH}-mac.zip"
          EXE_NAME="${PRODUCT_NAME}-${VERSION}-setup.exe"
          MAX_BYTES=$((300 * 1024 * 1024))

          ls -lh .
          for f in "$DMG_NAME" "$EXE_NAME"; do
            if [ ! -f "$f" ]; then
              echo "缺少产物: $f" >&2
              exit 1
            fi
            bytes=$(wc -c <"$f" | tr -d ' ')
            if [ "$bytes" -gt "$MAX_BYTES" ]; then
              echo "$f 为 $((bytes / 1024 / 1024)) MiB，超过 wrangler ~300 MiB 上限" >&2
              exit 1
            fi
            echo "ok: $f ($((bytes / 1024 / 1024)) MiB)"
          done

          WRANGLER_TMP="$(mktemp -d)"
          trap 'rm -rf "$WRANGLER_TMP"' EXIT
          ASSETS_ABS="$(pwd)"

          put() {
            key="$1"
            file="$2"
            echo "→ put ${CF_R2_BUCKET}/${key}"
            (
              cd "$WRANGLER_TMP"
              npx --yes wrangler@4 r2 object put "${CF_R2_BUCKET}/${key}" \
                --file="${ASSETS_ABS}/${file}" \
                --remote
            )
          }

          put "desktop/mac/${VERSION}/${DMG_NAME}" "$DMG_NAME"
          put "desktop/mac/latest/${PRODUCT_NAME}-${MAC_ARCH}.dmg" "$DMG_NAME"
          put "desktop/win/${VERSION}/${EXE_NAME}" "$EXE_NAME"
          put "desktop/win/latest/${PRODUCT_NAME}-x64-setup.exe" "$EXE_NAME"

          if [ -f "$ZIP_NAME" ]; then
            zip_bytes=$(wc -c <"$ZIP_NAME" | tr -d ' ')
            if [ "$zip_bytes" -gt "$MAX_BYTES" ]; then
              echo "⚠ 跳过 zip（${zip_bytes} bytes > 300 MiB）" >&2
            else
              put "desktop/mac/${VERSION}/${ZIP_NAME}" "$ZIP_NAME"
              put "desktop/mac/latest/${PRODUCT_NAME}-${MAC_ARCH}-mac.zip" "$ZIP_NAME"
            fi
          else
            echo "⚠ 跳过 zip（无 ${ZIP_NAME}）"
          fi

          echo "✅ R2 ${VERSION} 已上传"

      # latest 同路径覆盖；刷边缘缓存，避免 downloads.agentup.me 仍吐旧包
      - name: Purge downloads CDN cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOWNLOADS_BASE_URL: https://downloads.agentup.me
        run: |
          set -euo pipefail
          files="$(jq -nc \
            --arg base "$DOWNLOADS_BASE_URL" \
            '{files:[
              ($base + "/desktop/mac/latest/AgentUp-arm64.dmg"),
              ($base + "/desktop/mac/latest/AgentUp-arm64-mac.zip"),
              ($base + "/desktop/win/latest/AgentUp-x64-setup.exe")
            ]}')"
          echo "→ purge: $files"
          resp="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$files")"
          echo "$resp" | jq .
          echo "$resp" | jq -e '.success == true' >/dev/null
